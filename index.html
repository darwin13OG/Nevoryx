<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEVORYX | Entretenimiento Digital</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#2575fc',
                            neon: '#00d2ff',
                            dark: '#09090b',
                            zinc: '#18181b'
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .light .glass { background: rgba(0, 0, 0, 0.02); border: 1px solid rgba(0, 0, 0, 0.05); }
        .card-shadow { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-shadow:hover { transform: translateY(-6px); box-shadow: 0 12px 30px -5px rgba(37, 117, 252, 0.25); }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #09090b; }
        ::-webkit-scrollbar-thumb { background: #2575fc; border-radius: 10px; }
        
        /* Toast Animation */
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .toast { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-zinc-50 text-zinc-800 font-sans min-h-screen dark:bg-brand-dark dark:text-zinc-400 transition-colors duration-300">

    <!-- NOTIFICACIONES CUSTOM (TOASTS) -->
    <div id="toast-container" class="fixed top-6 right-6 z-[100] flex flex-col gap-3"></div>

    <!-- NAVBAR -->
    <nav class="sticky top-0 z-50 glass border-b border-black/5 dark:border-white/5 bg-white/70 dark:bg-black/60 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            <div class="flex items-center gap-3 cursor-pointer select-none group" id="logo-admin-trigger">
                <div class="w-10 h-10 bg-brand-blue rounded-xl flex items-center justify-center shadow-lg shadow-brand-blue/30 group-hover:scale-105 transition-transform duration-300">
                    <i class="fas fa-play text-white ml-1 text-sm"></i>
                </div>
                <span class="text-2xl font-black tracking-tighter text-zinc-900 dark:text-white">NEVORY<span class="text-brand-blue">X</span></span>
            </div>

            <div class="flex items-center gap-6 flex-1 max-w-md justify-end ml-4">
                <div class="relative w-full max-w-xs hidden sm:block">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-400">
                        <i class="fas fa-search text-xs"></i>
                    </span>
                    <input type="text" id="search-input" oninput="handleSearch(this.value)" placeholder="Buscar plataforma..." class="w-full bg-zinc-100 dark:bg-zinc-900 text-xs rounded-xl pl-9 pr-4 py-2.5 text-zinc-900 dark:text-white border border-black/5 dark:border-white/5 focus:ring-2 focus:ring-brand-blue outline-none transition-all">
                </div>
                <button id="theme-toggle" class="p-2.5 rounded-full hover:bg-zinc-200 dark:hover:bg-zinc-800 transition-colors">
                    <i id="theme-icon" class="fas fa-moon text-xl"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- BUSCADOR MÓVIL -->
    <div class="px-6 pt-4 sm:hidden">
        <div class="relative w-full">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none text-zinc-400">
                <i class="fas fa-search text-xs"></i>
            </span>
            <input type="text" id="search-input-mobile" oninput="handleSearch(this.value)" placeholder="Buscar plataforma..." class="w-full bg-white dark:bg-zinc-900 text-sm rounded-xl pl-9 pr-4 py-3 text-zinc-900 dark:text-white border border-black/5 dark:border-white/5 focus:ring-2 focus:ring-brand-blue outline-none transition-all shadow-sm">
        </div>
    </div>

    <!-- HERO SECTION -->
    <header class="max-w-7xl mx-auto px-6 pt-12 pb-6 text-center">
        <h1 class="text-4xl md:text-5xl font-black text-zinc-900 dark:text-white mb-4 tracking-tight leading-tight">
            Entretenimiento y <span class="text-brand-blue">Tecnología</span>
        </h1>
        <p class="text-zinc-500 dark:text-zinc-400 max-w-2xl mx-auto text-base md:text-lg">
            Cuentas estables y garantizadas con soporte prioritario.
        </p>
    </header>

    <!-- MAIN GRID -->
    <main class="max-w-7xl mx-auto px-6 py-8">
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Cargando... -->
        </div>
    </main>

    <!-- MODAL: LOGIN ADMIN (REEMPLAZA EL PROMPT) -->
    <div id="login-modal" class="fixed inset-0 z-[80] hidden flex items-center justify-center p-4 bg-black/90 backdrop-blur-md">
        <div class="bg-zinc-900 w-full max-w-sm rounded-3xl p-8 border border-white/10 shadow-2xl">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-brand-blue/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-lock text-brand-blue text-2xl"></i>
                </div>
                <h3 class="text-xl font-bold text-white">Acceso Administrativo</h3>
                <p class="text-zinc-500 text-sm mt-1">Solo personal autorizado</p>
            </div>
            <input type="password" id="admin-pass-input" placeholder="Contraseña" class="w-full bg-zinc-800 border-none rounded-xl p-4 text-white text-center focus:ring-2 focus:ring-brand-blue outline-none mb-4">
            <div class="flex gap-3">
                <button onclick="closeModal('login-modal')" class="flex-1 py-3 text-zinc-400 font-semibold">Cancelar</button>
                <button onclick="checkAdminAccess()" class="flex-1 bg-brand-blue hover:bg-blue-600 text-white font-bold py-3 rounded-xl transition-all">Entrar</button>
            </div>
        </div>
    </div>

    <!-- MODAL: COMPRA -->
    <div id="purchase-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4 bg-black/85 backdrop-blur-sm">
        <div class="bg-white dark:bg-zinc-900 w-full max-w-md rounded-3xl overflow-hidden border border-black/10 dark:border-white/10 shadow-2xl">
            <div class="p-6">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold text-zinc-900 dark:text-white">Finalizar Suscripción</h3>
                    <button onclick="closeModal('purchase-modal')" class="text-zinc-500 hover:text-red-500 transition-colors"><i class="fas fa-times"></i></button>
                </div>

                <div id="modal-product-info" class="mb-6 p-4 rounded-2xl bg-zinc-100 dark:bg-zinc-800/50 flex items-center gap-4"></div>

                <form id="purchase-form" class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Nombre Completo</label>
                        <input type="text" id="buyer-name" required placeholder="Ej. Juan Pérez" class="w-full bg-zinc-100 dark:bg-zinc-800 border-none rounded-xl p-3.5 text-zinc-900 dark:text-white focus:ring-2 focus:ring-brand-blue outline-none transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Monto a Pagar</label>
                        <input type="text" id="locked-price" readonly class="w-full bg-zinc-200 dark:bg-zinc-950 border-none rounded-xl p-3.5 text-brand-blue font-bold cursor-not-allowed">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-zinc-500 mb-1.5">Método de Pago</label>
                        <select id="payment-method" required class="w-full bg-zinc-100 dark:bg-zinc-800 border-none rounded-xl p-3.5 text-zinc-900 dark:text-white focus:ring-2 focus:ring-brand-blue outline-none cursor-pointer">
                            <option value="">Selecciona un método...</option>
                            <option value="Nequi">Nequi</option>
                            <option value="Daviplata">Daviplata</option>
                            <option value="Bre-B (Llaves)">Bre-B (Llaves)</option>
                        </select>
                    </div>

                    <div id="bank-details" class="hidden p-4 rounded-2xl bg-brand-blue/10 border border-brand-blue/20">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                            <div class="w-full">
                                <div id="acc-number" class="font-mono text-zinc-900 dark:text-white font-bold"></div>
                                <p id="acc-owner" class="text-xs text-zinc-500 mt-1"></p>
                            </div>
                            <button type="button" onclick="copyAccount(this)" class="bg-brand-blue text-white px-3 py-2 rounded-lg text-sm shrink-0 w-full sm:w-auto">Copiar</button>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-brand-blue hover:bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all active:scale-[0.98]">Confirmar Compra</button>
                </form>
            </div>
        </div>
    </div>

    <!-- MODAL: ADMIN CMS -->
    <div id="admin-modal" class="fixed inset-0 z-[70] hidden flex items-center justify-center p-4 bg-black/95">
        <div class="bg-zinc-900 w-full max-w-4xl max-h-[90vh] overflow-hidden rounded-3xl border border-white/10 flex flex-col shadow-2xl">
            <div class="p-6 border-b border-white/5 flex justify-between items-center">
                <h3 class="text-xl font-bold text-white"><i class="fas fa-user-shield mr-2 text-brand-blue"></i>Panel de Control</h3>
                <button onclick="closeModal('admin-modal')" class="text-zinc-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-8">
                <section class="bg-white/5 p-6 rounded-3xl border border-white/5">
                    <h4 class="text-xs font-bold text-zinc-400 uppercase tracking-widest mb-4">Nueva Plataforma</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
                        <input type="text" id="new-name" placeholder="Nombre" class="bg-zinc-800 rounded-xl p-3 text-white text-sm border-none">
                        <input type="text" id="new-price" placeholder="Precio (ej. 15.000)" class="bg-zinc-800 rounded-xl p-3 text-white text-sm border-none">
                        <input type="text" id="new-duration" placeholder="30 Días" class="bg-zinc-800 rounded-xl p-3 text-white text-sm border-none">
                        <input type="text" id="new-img" placeholder="URL Imagen" class="bg-zinc-800 rounded-xl p-3 text-white text-sm border-none">
                        <button onclick="addProduct()" class="bg-brand-blue hover:bg-blue-600 text-white font-bold rounded-xl px-4 py-3 transition-colors text-sm">Añadir</button>
                    </div>
                </section>
                <section>
                    <h4 class="text-xs font-bold text-zinc-400 uppercase mb-4">Inventario</h4>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <tbody id="admin-inventory-list" class="divide-y divide-white/5"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- FOOTER -->
    <footer class="max-w-7xl mx-auto px-6 py-12 text-center text-xs text-zinc-400 opacity-50">
        <p>© 2026 NEVORYX. Todos los derechos reservados.</p>
    </footer>

    <!-- BOTÓN WHATSAPP -->
    <div class="fixed bottom-6 right-6 z-[100]">
        <a href="https://wa.me/573124093345" target="_blank" class="flex items-center justify-center w-14 h-14 bg-[#25D366] text-white rounded-2xl shadow-2xl hover:scale-110 transition-all border-b-4 border-green-700">
            <i class="fab fa-whatsapp text-2xl"></i>
        </a>
    </div>

    <script>
        // CONFIG SUPABASE
        const SUPABASE_URL = "https://anhoncimcwqzektwfrba.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuaG9uY2ltY3dxemVrdHdmcmJhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NTk2MDgsImV4cCI6MjA5NjUzNTYwOH0.WBJ-VL-exooaKog_-MFCvpiYL9-4Rd3kHgqI3_GFlpI"; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const FALLBACK_IMAGE = "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?q=80&w=500&auto=format&fit=crop";
        let products = [];
        let selectedProduct = null;
        let clickCount = 0;

        // NOTIFICACIONES CUSTOM
        function showToast(msg, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const colors = type === 'success' ? 'bg-green-500' : 'bg-red-500';
            const icons = type === 'success' ? 'fa-check-circle' : 'fa-exclamation-triangle';
            
            toast.className = `toast flex items-center gap-3 ${colors} text-white px-6 py-4 rounded-2xl shadow-2xl font-bold text-sm min-w-[280px]`;
            toast.innerHTML = `<i class="fas ${icons}"></i> <span>${msg}</span>`;
            
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateX(20px)';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        async function init() {
            setupTheme();
            await fetchProducts();
        }

        async function fetchProducts() {
            try {
                const { data, error } = await supabaseClient.from('products').select('*').order('id', { ascending: true });
                if (error) throw error;
                products = data || [];
                renderProducts();
            } catch (err) {
                showToast("Error de conexión con la base de datos", "error");
            }
        }

        function renderProducts(query = "") {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';
            
            const filtered = products.filter(p => p.name.toLowerCase().includes(query.toLowerCase()));

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-20 opacity-40"><i class="fas fa-search text-4xl mb-4"></i><p>No hay resultados</p></div>`;
                return;
            }

            filtered.forEach(p => {
                const isOut = p.stock <= 0;
                const card = `
                    <div class="glass rounded-3xl p-4 card-shadow ${isOut ? 'opacity-60' : ''}">
                        <div class="aspect-video rounded-2xl overflow-hidden mb-4 bg-zinc-900">
                            <img src="${p.image || FALLBACK_IMAGE}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex justify-between items-start mb-2">
                            <h3 class="font-bold text-lg dark:text-white leading-tight">${p.name}</h3>
                            <span class="text-[10px] font-bold px-2 py-1 rounded-md ${isOut ? 'bg-red-500/20 text-red-500' : 'bg-green-500/20 text-green-500'}">
                                ${isOut ? 'AGOTADO' : p.stock + ' DISP.'}
                            </span>
                        </div>
                        <p class="text-brand-blue font-black text-xl mb-4">${p.price}</p>
                        <button onclick="openPurchaseModal(${p.id})" ${isOut ? 'disabled' : ''} class="w-full py-3 rounded-xl font-bold ${isOut ? 'bg-zinc-800 text-zinc-500 cursor-not-allowed' : 'bg-brand-blue text-white hover:bg-blue-600 shadow-lg shadow-brand-blue/20 transition-all active:scale-95'}">
                            ${isOut ? 'Agotado' : 'Comprar Ahora'}
                        </button>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        function handleSearch(val) {
            document.getElementById('search-input').value = val;
            document.getElementById('search-input-mobile').value = val;
            renderProducts(val);
        }

        function openPurchaseModal(id) {
            selectedProduct = products.find(p => p.id === id);
            document.getElementById('modal-product-info').innerHTML = `
                <img src="${selectedProduct.image || FALLBACK_IMAGE}" class="w-16 h-10 object-cover rounded-lg">
                <div><h4 class="font-bold dark:text-white">${selectedProduct.name}</h4><p class="text-xs text-zinc-500">${selectedProduct.duration || '30 Días'}</p></div>
            `;
            document.getElementById('locked-price').value = selectedProduct.price;
            document.getElementById('purchase-modal').classList.remove('hidden');
        }

        document.getElementById('payment-method').addEventListener('change', function(e) {
            const container = document.getElementById('bank-details');
            const accNum = document.getElementById('acc-number');
            const accOwn = document.getElementById('acc-owner');
            container.classList.toggle('hidden', !e.target.value);
            
            if (e.target.value === 'Nequi') {
                accNum.innerText = '312-409-3345';
                accOwn.innerText = 'Titular: Darwin';
            } else if (e.target.value === 'Daviplata') {
                accNum.innerText = '312-409-3345';
                accOwn.innerText = 'Titular: Durleny C.';
            } else if (e.target.value === 'Bre-B (Llaves)') {
                accNum.innerText = 'Cel: 3124093345';
                accOwn.innerText = 'Durleny Castañeda';
            }
        });

        document.getElementById('purchase-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const buyer = document.getElementById('buyer-name').value;
            const bank = document.getElementById('payment-method').value;

            const { error } = await supabaseClient.from('products').update({ stock: selectedProduct.stock - 1 }).eq('id', selectedProduct.id);
            if (error) return showToast("Error al procesar stock", "error");

            const msg = `¡Hola Nevoryx! Realicé el pago para: ${selectedProduct.name}\n👤 Cliente: ${buyer}\n💰 Valor: ${selectedProduct.price}\n🏦 Pago: ${bank}`;
            window.open(`https://wa.me/573124093345?text=${encodeURIComponent(msg)}`, '_blank');
            
            closeModal('purchase-modal');
            showToast("Pedido enviado correctamente");
            fetchProducts();
        });

        // ADMIN ACCESS
        document.getElementById('logo-admin-trigger').addEventListener('click', () => {
            clickCount++;
            if (clickCount >= 3) {
                document.getElementById('login-modal').classList.remove('hidden');
                clickCount = 0;
            }
            setTimeout(() => clickCount = 0, 2000);
        });

        function checkAdminAccess() {
            const pass = document.getElementById('admin-pass-input').value;
            if (pass === "darwin13") { // Password simple
                closeModal('login-modal');
                openAdmin();
            } else {
                showToast("Contraseña Incorrecta", "error");
            }
            document.getElementById('admin-pass-input').value = "";
        }

        function openAdmin() {
            const list = document.getElementById('admin-inventory-list');
            list.innerHTML = '';
            products.forEach(p => {
                list.innerHTML += `
                    <tr class="hover:bg-white/5 transition-colors">
                        <td class="py-4 text-white font-medium text-sm">${p.name}</td>
                        <td class="py-4">
                            <input type="number" onchange="updateStock(${p.id}, this.value)" value="${p.stock}" class="w-16 bg-zinc-800 text-white rounded-lg p-1 text-center text-sm border-none">
                        </td>
                        <td class="py-4 text-right">
                            <button onclick="deleteProduct(${p.id})" class="text-red-500 hover:text-red-400 px-3"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
            document.getElementById('admin-modal').classList.remove('hidden');
        }

        async function updateStock(id, val) {
            const { error } = await supabaseClient.from('products').update({ stock: parseInt(val) }).eq('id', id);
            if (!error) {
                showToast("Stock actualizado");
                fetchProducts();
            }
        }

        async function addProduct() {
            const name = document.getElementById('new-name').value;
            const price = document.getElementById('new-price').value;
            const duration = document.getElementById('new-duration').value || "30 Días";
            const image = document.getElementById('new-img').value;

            if (!name || !price) return showToast("Faltan datos", "error");

            const { error } = await supabaseClient.from('products').insert([{ name, price: '$' + price, duration, image, stock: 5 }]);
            if (!error) {
                showToast("Producto añadido");
                fetchProducts();
                openAdmin();
                ['new-name', 'new-price', 'new-duration', 'new-img'].forEach(id => document.getElementById(id).value = "");
            }
        }

        async function deleteProduct(id) {
            if(confirm("¿Seguro que deseas eliminarlo?")) {
                const { error } = await supabaseClient.from('products').delete().eq('id', id);
                if (!error) {
                    showToast("Eliminado con éxito");
                    fetchProducts();
                    setTimeout(openAdmin, 500);
                }
            }
        }

        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function copyAccount(btn) {
            const method = document.getElementById('payment-method').value;
            const text = method === 'Bre-B (Llaves)' ? '3124093345' : '312-409-3345';
            navigator.clipboard.writeText(text);
            btn.innerText = "¡Copiado!";
            setTimeout(() => btn.innerText = "Copiar", 2000);
        }

        function setupTheme() {
            const toggle = document.getElementById('theme-toggle');
            const icon = document.getElementById('theme-icon');
            const html = document.documentElement;

            toggle.addEventListener('click', () => {
                const isDark = html.classList.toggle('dark');
                icon.className = isDark ? 'fas fa-moon text-xl text-brand-blue' : 'fas fa-sun text-xl text-orange-500';
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            if (localStorage.getItem('theme') === 'light') {
                html.classList.remove('dark');
                icon.className = 'fas fa-sun text-xl text-orange-500';
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
